name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: .tools/playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Download and verify pinned mdBook 0.5.4
        shell: bash
        run: |
          mkdir -p .tools/mdbook-0.5.4
          curl --fail --location --retry 3 https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz --output .tools/mdbook-0.5.4/mdbook.tar.gz
          echo '5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89  .tools/mdbook-0.5.4/mdbook.tar.gz' | sha256sum --check
          tar -xzf .tools/mdbook-0.5.4/mdbook.tar.gz -C .tools/mdbook-0.5.4
          .tools/mdbook-0.5.4/mdbook --version
      - name: Download and verify pinned mdbook-mermaid 0.17.1
        shell: bash
        run: |
          mkdir -p .tools/mdbook-mermaid-0.17.1
          curl --fail --location --retry 3 https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-musl.tar.gz --output .tools/mdbook-mermaid-0.17.1/mdbook-mermaid.tar.gz
          echo '42aca57eea8521971cc595fe4bb853c5b8b7d9f7138a2ec9f14a0a72c210922d  .tools/mdbook-mermaid-0.17.1/mdbook-mermaid.tar.gz' | sha256sum --check
          tar -xzf .tools/mdbook-mermaid-0.17.1/mdbook-mermaid.tar.gz -C .tools/mdbook-mermaid-0.17.1
          echo "$GITHUB_WORKSPACE/.tools/mdbook-mermaid-0.17.1" >> "$GITHUB_PATH"
      - name: Install documentation checks and verify the vendored Mermaid bundle
        run: |
          npm ci --ignore-scripts --prefix tools/docs
          npm run bundle --prefix tools/docs -- --check
          node tools/docs/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Build and check portable HTML documentation
        run: |
          git lfs pull --include="docs/verification/*-preview.png" --exclude=""
          .tools/mdbook-0.5.4/mdbook build docs
          python -B tools/docs/check_html.py build/docs
          npm run check --prefix tools/docs
      - uses: actions/upload-artifact@v4
        with:
          name: rendergraph-html
          path: build/docs/
          if-no-files-found: error

  asset-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r tools/bistro/requirements.txt
      - run: python -B -m unittest discover -s tools/bistro -p 'test_*.py'
      - name: Test Godot benchmark evidence acceptance without GPU access
        run: python -B -m unittest discover -s tools/godot_bistro -p 'test_*.py'
      - name: Test Tracy planning, identity, and disk-backed zone analysis without GPU access
        run: python -B -m unittest discover -s tools/tracy -p 'test_*.py'
      - name: Validate pinned Bistro camera and lighting conditions without hydrating assets
        run: python -B tools/bistro/conditions.py tools/bistro/conditions.json
      - name: Check Bistro LFS pointers against the payload manifest
        run: python -B tools/bistro/verify_lfs_assets.py --pointers
      - run: npm ci --ignore-scripts --prefix tools/bistro-validator
      - run: npm test --prefix tools/bistro-validator
      - name: Check managed shader ABI contracts without an SDK
        shell: pwsh
        run: ./crates/renderer/shaders/test-managed-abi.ps1
      - name: Verify Pipeline shader sources and generated artifacts without an SDK
        run: |
          python -B -m unittest discover -s tools/shaders -p 'test_*.py'
          python -B tools/shaders/verify_pipeline_manifest.py

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check dependency advisories, licenses, versions, and sources
        # cargo-deny-action v2.1.1, containing cargo-deny 0.20.2.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"
          arguments: --locked
      - name: Check the isolated binding generator dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"
          manifest-path: tools/d3d12-bindings/Cargo.toml
          arguments: --locked --config deny.toml

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/d3d12-bindings/Cargo.toml -- --check

  check:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        backend: [cpu, vulkan]
        include:
          - os: windows-2022
            backend: presentation
          - os: windows-2022
            backend: vulkan,presentation
          - os: windows-2022
            backend: d3d12,presentation
          - os: windows-2022
            backend: vulkan,d3d12,presentation
          - os: windows-2022
            backend: d3d12
          - os: windows-2022
            backend: vulkan,d3d12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        if: matrix.backend == 'cpu'
        with:
          python-version: "3.11"
      - name: Test CPU profiling tools without ETW or GPU access
        if: matrix.backend == 'cpu'
        run: python -B -m unittest discover -s tools/cpu_profile -p 'test_*.py'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native C compiler for development dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc
      - name: Install VMA C++ compiler (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: sudo apt-get install -y --no-install-recommends g++
      - name: Check, lint, and test
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
          CARGO_INCREMENTAL: "0"
        run: |
          foreach ($development in @($false, $true)) {
            $features = @()
            if ($env:BACKEND -ne 'cpu') { $features += $env:BACKEND }
            if ($development) { $features += 'development-validation,graph-diagnostics' }
            $featureArgs = @('--no-default-features')
            if ($features.Count) { $featureArgs += @('--features', ($features -join ',')) }
            cargo check --locked --workspace --all-targets @featureArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --locked --workspace --all-targets @featureArgs -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Select test targets so Cargo does not link the two examples named bistro together.
            cargo test --locked --workspace --tests @featureArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --workspace --doc @featureArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:BACKEND -like '*presentation*') {
              cargo test --locked -p renderer --example windowed @featureArgs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              cargo test --locked --release -p renderer --example windowed @featureArgs
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Check optimized backend execution with and without development validation
        if: contains(matrix.backend, 'vulkan') || contains(matrix.backend, 'd3d12')
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
          CARGO_INCREMENTAL: "0"
        run: |
          foreach ($features in @($env:BACKEND, "$($env:BACKEND),development-validation,graph-diagnostics")) {
            cargo test --locked --workspace --release --no-default-features --features $features --tests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --workspace --release --no-default-features --features $features --doc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test optimized Rust pipeline preparation and composition
        if: runner.os == 'Linux' && matrix.backend == 'cpu'
        shell: pwsh
        run: |
          cargo test --locked --release -p renderer --no-default-features --lib capacity::preparation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release -p renderer-pipeline --no-default-features --lib --tests
      - name: Exercise the CPU Graph composition examples
        if: matrix.backend == 'cpu'
        shell: pwsh
        run: |
          cargo test --locked -p renderer --example graph_composition --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p renderer --example graph_composition --release --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p renderer --example graph_composition --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p renderer-pipeline --example rust_pipeline --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked --release -p renderer-pipeline --example rust_pipeline --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p renderer-pipeline --example rust_pipeline --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test frame loop contracts without GPU access
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          cargo test --locked -p renderer --example frame_loop --no-default-features --features vulkan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p renderer --example frame_loop --release --no-default-features --features vulkan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check both Bistro demos on representative platforms
        if: (runner.os == 'Linux' && matrix.backend == 'vulkan') || matrix.backend == 'vulkan,d3d12,presentation'
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          cargo clippy --locked -p renderer --example bistro --no-default-features --features $env:BACKEND -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p renderer-pipeline --example bistro --no-default-features --features $env:BACKEND -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the PBR Forward example without GPU access
        if: (runner.os == 'Linux' && matrix.backend == 'vulkan') || matrix.backend == 'vulkan,d3d12,presentation'
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          cargo check --locked -p renderer-pipeline --example pbr_forward --no-default-features --features $env:BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p renderer-pipeline --test pbr_gpu --no-default-features --features $env:BACKEND
      - name: Test Bistro sample contracts once without GPU access
        if: matrix.backend == 'vulkan,d3d12,presentation'
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          $features = "$env:BACKEND,tracy,development-validation,graph-diagnostics"
          cargo test --locked -p renderer --example bistro --no-default-features --features $features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p renderer-pipeline --example bistro --no-default-features --features $features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the CPU frame-memory workload
        if: matrix.backend == 'cpu'
        run: cargo run --locked -p renderer --example frame_memory --release --no-default-features --features memory-profiling -- cpu
      - name: Check the memory-profiling feature with both backends
        if: matrix.backend == 'vulkan,d3d12,presentation'
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features vulkan,d3d12,presentation,memory-profiling -- -D warnings
      - name: Check independent diagnostic features
        if: matrix.backend == 'vulkan' || contains(matrix.backend, 'd3d12')
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          $diagnostics = @('graph-diagnostics', 'development-validation')
          if ($env:BACKEND.Contains('vulkan')) { $diagnostics += 'vulkan-diagnostics' }
          if ($env:BACKEND.Contains('d3d12')) { $diagnostics += 'd3d12-diagnostics' }
          foreach ($diagnostic in $diagnostics) {
            $features = "$($env:BACKEND),$diagnostic"
            cargo check --locked --workspace --all-targets --no-default-features --features $features
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check optional Tracy instrumentation in shipping and development configurations
        if: matrix.backend == 'vulkan' || matrix.backend == 'vulkan,d3d12'
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          foreach ($features in @("$($env:BACKEND),tracy", "$($env:BACKEND),tracy,development-validation,graph-diagnostics")) {
            cargo clippy --locked --workspace --all-targets --no-default-features --features $features -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --workspace --release --no-default-features --features $features --tests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --workspace --release --no-default-features --features $features --doc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
