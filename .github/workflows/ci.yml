name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  asset-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r tools/bistro/requirements.txt
      - run: python -B -m unittest discover -s tools/bistro -p 'test_*.py'
      - run: npm ci --ignore-scripts --prefix tools/bistro-validator
      - run: npm test --prefix tools/bistro-validator

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency advisories, licenses, versions, and sources
        # cargo-deny-action v2.1.1, containing cargo-deny 0.20.2.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"
          arguments: --locked
      - name: Check the isolated binding generator dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"
          manifest-path: tools/d3d12-bindings/Cargo.toml
          arguments: --locked --config deny.toml

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/d3d12-bindings/Cargo.toml -- --check

  check:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        backend: [cpu, vulkan]
        include:
          - os: windows-2022
            backend: presentation
          - os: windows-2022
            backend: d3d12
          - os: windows-2022
            backend: vulkan,d3d12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native C compiler for development dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc
      - name: Install VMA C++ compiler (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: sudo apt-get install -y --no-install-recommends g++
      - name: Check, lint, and test
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
          CARGO_INCREMENTAL: "0"
        run: |
          foreach ($development in @($false, $true)) {
            $features = @()
            if ($env:BACKEND -ne 'cpu') { $features += $env:BACKEND }
            if ($development) { $features += 'development-validation,graph-diagnostics' }
            $featureArgs = @('--no-default-features')
            if ($features.Count) { $featureArgs += @('--features', ($features -join ',')) }
            cargo check --locked --workspace --all-targets @featureArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo clippy --locked --workspace --all-targets @featureArgs -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked --workspace @featureArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check optimized backend execution with and without development validation
        if: matrix.backend == 'vulkan' || contains(matrix.backend, 'd3d12')
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
          CARGO_INCREMENTAL: "0"
        run: |
          foreach ($features in @($env:BACKEND, "$($env:BACKEND),development-validation,graph-diagnostics")) {
            cargo test --locked --workspace --release --no-default-features --features $features
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check independent diagnostic features
        if: matrix.backend == 'vulkan' || contains(matrix.backend, 'd3d12')
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          $diagnostics = @('graph-diagnostics', 'development-validation')
          if ($env:BACKEND.Contains('vulkan')) { $diagnostics += 'vulkan-diagnostics' }
          if ($env:BACKEND.Contains('d3d12')) { $diagnostics += 'd3d12-diagnostics' }
          foreach ($diagnostic in $diagnostics) {
            $features = "$($env:BACKEND),$diagnostic"
            cargo check --locked --workspace --all-targets --no-default-features --features $features
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
