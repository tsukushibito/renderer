name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 2
      - name: Select checks from the changed paths
        id: diff
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or unavailable comparison base gets the full check.
          browser=true
          docs_only=false
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then
            if git cat-file -e "$BASE^{commit}" || git fetch --no-tags --depth=1 origin "$BASE"; then
              if git diff --quiet "$BASE" HEAD -- docs tools/docs .gitattributes .github/workflows/ci.yml; then
                browser=false
              elif [[ $? == 1 ]] && git diff --quiet --no-renames "$BASE" HEAD -- . ':(exclude,glob)docs/guides/*.md' ':(exclude)docs/verification/current.md'; then
                docs_only=true
              fi
            fi
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  documentation:
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify pinned mdBook 0.5.4
        shell: bash
        run: |
          mkdir -p .tools/mdbook-0.5.4
          curl --fail --location --retry 3 https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-musl.tar.gz --output .tools/mdbook-0.5.4/mdbook.tar.gz
          echo '5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89  .tools/mdbook-0.5.4/mdbook.tar.gz' | sha256sum --check
          tar -xzf .tools/mdbook-0.5.4/mdbook.tar.gz -C .tools/mdbook-0.5.4
          .tools/mdbook-0.5.4/mdbook --version
      - name: Download and verify pinned mdbook-mermaid 0.17.1
        shell: bash
        run: |
          mkdir -p .tools/mdbook-mermaid-0.17.1
          curl --fail --location --retry 3 https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-musl.tar.gz --output .tools/mdbook-mermaid-0.17.1/mdbook-mermaid.tar.gz
          echo '42aca57eea8521971cc595fe4bb853c5b8b7d9f7138a2ec9f14a0a72c210922d  .tools/mdbook-mermaid-0.17.1/mdbook-mermaid.tar.gz' | sha256sum --check
          tar -xzf .tools/mdbook-mermaid-0.17.1/mdbook-mermaid.tar.gz -C .tools/mdbook-mermaid-0.17.1
          echo "$GITHUB_WORKSPACE/.tools/mdbook-mermaid-0.17.1" >> "$GITHUB_PATH"
      - name: Build and check portable HTML documentation
        run: |
          git lfs pull --include="docs/verification/*-preview.png" --exclude=""
          .tools/mdbook-0.5.4/mdbook build docs
          python -B tools/docs/check_html.py build/docs
      - name: Verify the Mermaid bundle and render diagrams in Chromium
        if: needs.changes.outputs.browser == 'true'
        run: |
          # Match tools/docs/package-lock.json; the image includes Chromium, fonts and OS libraries.
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --volume "$PWD:/work" --workdir /work \
            mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579 \
            bash -ec 'npm ci --ignore-scripts --prefix tools/docs
                      npm run bundle --prefix tools/docs -- --check
                      npm run check --prefix tools/docs'
      - uses: actions/upload-artifact@v4
        with:
          name: rendergraph-html
          path: build/docs/
          if-no-files-found: error

  asset-tools:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r tools/bistro/requirements.txt
      - run: python -B -m unittest discover -s tools/bistro -p 'test_*.py'
      - name: Test Godot benchmark evidence acceptance without GPU access
        run: python -B -m unittest discover -s tools/godot_bistro -p 'test_*.py'
      - name: Test Tracy planning, identity, and disk-backed zone analysis without GPU access
        run: python -B -m unittest discover -s tools/tracy -p 'test_*.py'
      - name: Check survivor benchmark sample validation and aggregation
        run: python -B -m unittest discover -s tools/survivor -p 'test_*.py'
      - name: Validate pinned Bistro camera and lighting conditions without hydrating assets
        run: python -B tools/bistro/conditions.py tools/bistro/conditions.json
      - name: Check Bistro LFS pointers against the payload manifest
        run: python -B tools/bistro/verify_lfs_assets.py --pointers
      - run: npm ci --ignore-scripts --prefix tools/bistro-validator
      - run: npm test --prefix tools/bistro-validator
      - name: Check managed shader ABI contracts without an SDK
        shell: pwsh
        run: ./crates/sashiko-renderer-core/shaders/test-managed-abi.ps1
      - name: Verify Pipeline shader sources and generated artifacts without an SDK
        run: |
          python -B -m unittest discover -s tools/shaders -p 'test_*.py'
          python -B tools/shaders/verify_pipeline_manifest.py
      - name: Verify packaged WGSL sources, digests, and modules
        run: |
          cargo install --locked naga-cli --version 30.0.0
          python -B tools/shaders/webgpu.py --validate-packaged

  webgpu:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rustup target add wasm32-unknown-unknown
      - &install-wasm-bindgen
        name: Install the matching wasm-bindgen CLI and test runner
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(next(p['version'] for p in tomllib.load(open('Cargo.lock','rb'))['package'] if p['name']=='wasm-bindgen'))"
          $archive = "wasm-bindgen-$version-x86_64-pc-windows-msvc"
          $url = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz"
          $download = Join-Path $env:RUNNER_TEMP "$archive.tar.gz"
          curl.exe --fail --location --retry 3 $url --output $download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $download).Hash -ne '844d23f1b56097549b936dd2e0d561fadebc1e8c9e985d5068b6b919654104ad') {
            throw "Update the pinned SHA-256 when changing wasm-bindgen in Cargo.lock"
          }
          tar -xzf $download -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:RUNNER_TEMP $archive >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the shipping browser target
        run: cargo check --locked --release --lib -p renderer-scenes --target wasm32-unknown-unknown --features webgpu
      - name: Build the validation-enabled viewer
        run: python -B tools/renderer-scenes/build_web.py --out build/webgpu --development-validation
      - name: Install browser verification dependencies
        run: |
          python -m pip install numpy==1.26.4 Pillow==11.1.0 psutil==7.0.0 playwright==1.65.0
          python -m playwright install chromium --no-shell
      - name: Test the public WebGPU runtime on Chromium with SwiftShader
        run: python -B tools/run_webgpu_tests.py --channel chromium --software --development-validation
      - name: Run the packaged viewer on Chromium with SwiftShader
        run: python -B tools/renderer-scenes/verify_web.py build/webgpu --channel chromium --software --output build/webgpu-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-fixture
          path: build/webgpu-result/
          if-no-files-found: ignore

  browser-jobs:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rustup target add wasm32-unknown-unknown
      - *install-wasm-bindgen
      - name: Install Chromium for the worker tests
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install chromium --no-shell
      - name: Build and exercise shared CPU jobs on native and browser workers
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --release -p sashiko-jobs
          cargo run --locked --release -p sashiko-jobs --example frame_jobs
          rustup toolchain install nightly-2026-11-15 --profile minimal --component rust-src --target wasm32-unknown-unknown
          python -B examples/jobs-web/build.py
          python -B examples/jobs-web/verify.py build/jobs-web

  dependencies:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check dependency advisories, licenses, versions, and sources
        # cargo-deny-action v2.1.1, containing cargo-deny 0.20.2.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"
          arguments: --locked
      - name: Check the isolated binding generator dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"
          manifest-path: tools/d3d12-bindings/Cargo.toml
          arguments: --locked --config deny.toml

  format:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/d3d12-bindings/Cargo.toml -- --check

  check:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    env:
      BACKEND: ${{ matrix.backend }}
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        backend: [cpu, vulkan]
        include:
          - os: windows-2022
            backend: presentation
          - os: windows-2022
            backend: vulkan,presentation
          - os: windows-2022
            backend: d3d12,presentation
          - os: windows-2022
            backend: vulkan,d3d12,presentation
          - os: windows-2022
            backend: d3d12
          - os: windows-2022
            backend: vulkan,d3d12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        if: matrix.backend == 'cpu'
        with:
          python-version: "3.11"
      - name: Test CPU profiling tools without ETW or GPU access
        if: matrix.backend == 'cpu'
        run: python -B -m unittest discover -s tools/cpu_profile -p 'test_*.py'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native C compiler for development dependencies (Linux)
        if: runner.os == 'Linux'
        run: command -v gcc || (sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc)
      - name: Install VMA C++ compiler (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: command -v g++ || (sudo apt-get update && sudo apt-get install -y --no-install-recommends g++)
      - &cargo-cache
        name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Cargo feature lists can contain commas. Hash BACKEND instead of putting it in the key.
          env-vars: BACKEND
          # These lint lanes now also populate release dependencies. Give them writable cache entries.
          key: ${{ matrix.suite || (runner.os == 'Windows' && (contains(matrix.backend, 'vulkan') || contains(matrix.backend, 'd3d12')) && 'with-release') || '' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint all targets in shipping and development configurations
        shell: pwsh
        run: |
          foreach ($development in @($false, $true)) {
            $features = @()
            if ($env:BACKEND -ne 'cpu') { $features += $env:BACKEND }
            if ($development) { $features += 'development-validation,graph-diagnostics' }
            $featureArgs = @('--no-default-features')
            if ($features.Count) { $featureArgs += @('--features', ($features -join ',')) }
            cargo clippy --locked --workspace --all-targets @featureArgs -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run workspace tests on Linux CPU
        if: runner.os == 'Linux' && matrix.backend == 'cpu'
        run: cargo test --locked --workspace --tests --no-default-features
      - name: Exercise persistent game inspection through stdio
        if: matrix.backend == 'cpu'
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $binary = "target/debug/inspector-door$suffix"
          cargo build --locked -p inspector-door
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $shipping = Join-Path $env:RUNNER_TEMP "inspector-door-shipping$suffix"
          Copy-Item $binary $shipping
          cargo build --locked -p inspector-door --features live-inspector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/inspect/verify.py $binary --shipping $shipping
      - name: Verify packaged game and saved profile from a clean working directory
        if: runner.os == 'Linux' && matrix.backend == 'cpu'
        run: |
          cargo build --locked -p survivor --no-default-features
          python -B tools/package_game.py --project assets/survivor/package.json --exe target/debug/survivor --output build/survivor-package
          python -B tools/survivor/verify_package.py build/survivor-package
      - name: Verify scene editing, writer recovery, game replay and cooked clip sampling
        if: matrix.backend == 'cpu'
        shell: pwsh
        run: |
          cargo build --locked -p survivor --no-default-features --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python -B tools/editor/verify.py --inspector "target/debug/survivor-inspector$suffix" --game "target/debug/survivor$suffix"
      - name: Run workspace tests on Linux Vulkan with development validation
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: cargo test --locked --workspace --tests --no-default-features --features vulkan,development-validation,graph-diagnostics
      - name: Test optimized native backend execution
        if: runner.os == 'Windows' && (contains(matrix.backend, 'vulkan') || contains(matrix.backend, 'd3d12'))
        shell: pwsh
        env:
          # The single-backend presentation lanes have room for both sets of tests.
          TEST_MODES: ${{ (matrix.backend == 'vulkan,presentation' || matrix.backend == 'd3d12,presentation') && 'shipping development' || 'shipping' }}
        run: &native-release-tests |
          foreach ($mode in $env:TEST_MODES.Split(' ')) {
            $features = $env:BACKEND
            if ($mode -eq 'development') { $features += ',development-validation,graph-diagnostics' }
            cargo test --locked -p sashiko-renderer-core --lib --release --no-default-features --features $features -- backends:: runtime:: presentation:: program::
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test presentation contracts without a native backend
        if: matrix.backend == 'presentation'
        run: |
          cargo test --locked -p sashiko-renderer-core --lib --no-default-features --features presentation -- presentation:: program::
      - name: Test workspace documentation on Linux CPU
        if: runner.os == 'Linux' && matrix.backend == 'cpu'
        run: cargo test --locked --workspace --doc --no-default-features
      - name: Build and exercise the Canvas sample
        if: runner.os == 'Linux' && matrix.backend == 'cpu'
        run: |
          rustup target add wasm32-unknown-unknown
          python examples/survivor-web/build.py
          node examples/survivor-web/verify.mjs build/survivor-web/survivor.wasm
      # The sample project selects its own D3D12 features. Use the shorter Windows presentation lane.
      - uses: actions/setup-dotnet@v4
        if: matrix.backend == 'presentation'
        with:
          dotnet-version: '10.0.x'
      - name: Build the WinForms editor and native game
        if: matrix.backend == 'presentation'
        run: dotnet build examples/survivor-winforms -c Release
      - name: Test windowed event-loop contracts without a GPU
        if: runner.os == 'Windows' && matrix.backend == 'vulkan,d3d12,presentation'
        run: cargo test --locked -p sashiko-renderer-core --example windowed --no-default-features --features vulkan,d3d12,presentation
      - name: Test optimized Rust pipeline preparation and composition
        if: runner.os == 'Linux' && matrix.backend == 'cpu'
        shell: pwsh
        run: |
          cargo test --locked --release -p sashiko-renderer-core --no-default-features --lib capacity::preparation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release -p sashiko-renderer --no-default-features --lib --tests
      - name: Exercise the CPU Graph composition examples
        if: runner.os == 'Linux' && matrix.backend == 'cpu'
        shell: pwsh
        run: |
          cargo test --locked -p sashiko-renderer-core --example graph_composition --release --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p sashiko-renderer-core --example graph_composition --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --locked -p sashiko-renderer --example rust_pipeline --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release -p sashiko-renderer --example rust_pipeline --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test frame loop contracts without GPU access
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: cargo test --locked -p sashiko-renderer-core --example frame_loop --release --no-default-features --features vulkan
      - name: Check Bistro with its standalone dependency features
        if: (runner.os == 'Linux' && matrix.backend == 'vulkan') || matrix.backend == 'vulkan,d3d12,presentation'
        shell: pwsh
        run: |
          cargo check --locked -p renderer-scenes --all-targets --no-default-features --features $env:BACKEND
      - name: Build and test the PBR Forward example without GPU access
        if: (runner.os == 'Linux' && matrix.backend == 'vulkan') || matrix.backend == 'vulkan,d3d12,presentation'
        shell: pwsh
        run: |
          cargo check --locked -p sashiko-renderer --example pbr_forward --no-default-features --features $env:BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p sashiko-renderer --test pbr_gpu --no-default-features --features $env:BACKEND
      - name: Test Bistro sample contracts once without GPU access
        if: matrix.backend == 'vulkan,d3d12,presentation'
        shell: pwsh
        run: |
          $features = "$env:BACKEND,tracy,development-validation,graph-diagnostics"
          cargo test --locked -p renderer-scenes --no-default-features --features $features --lib --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the CPU frame-memory workload
        if: matrix.backend == 'cpu'
        run: cargo run --locked -p sashiko-renderer-core --example frame_memory --release --no-default-features --features memory-profiling -- cpu
      - name: Check the memory-profiling feature with both backends
        if: matrix.backend == 'vulkan,d3d12,presentation'
        run: cargo clippy --locked --workspace --all-targets --no-default-features --features vulkan,d3d12,presentation,memory-profiling -- -D warnings
      - name: Check independent diagnostic features
        if: matrix.backend != 'vulkan,d3d12,presentation' && (matrix.backend == 'vulkan' || contains(matrix.backend, 'd3d12'))
        shell: pwsh
        run: &diagnostic-checks |
          $diagnostics = @('graph-diagnostics', 'development-validation')
          if ($env:BACKEND.Contains('vulkan')) { $diagnostics += 'vulkan-diagnostics' }
          if ($env:BACKEND.Contains('d3d12')) { $diagnostics += 'd3d12-diagnostics' }
          foreach ($diagnostic in $diagnostics) {
            $features = "$($env:BACKEND),$diagnostic"
            cargo check --locked --workspace --all-targets --no-default-features --features $features
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  linux-vulkan-release:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    env:
      BACKEND: vulkan
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: rustup show active-toolchain
      - name: Cache release and Tracy dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check optimized backend execution with and without development validation
        shell: pwsh
        env:
          TEST_MODES: shipping development
        run: *native-release-tests
      - name: Check optional Tracy instrumentation in shipping and development configurations
        shell: pwsh
        env:
          TRACY_CONFIGS: vulkan,tracy vulkan,tracy,development-validation,graph-diagnostics
        run: &tracy-tests |
          foreach ($features in $env:TRACY_CONFIGS.Split(' ')) {
            cargo clippy --locked --workspace --all-targets --no-default-features --features $features -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test --locked -p renderer-scenes --lib --release --no-default-features --features $features -- shared::trace:: capture_handshake_is_only_available_with_tracy
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  windows-workspace-tests:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-2022
    name: Windows release workspace / ${{ matrix.targets }}
    strategy:
      fail-fast: false
      matrix:
        targets: [unit, integration]
    env:
      CARGO_INCREMENTAL: "0"
      FEATURES: vulkan,d3d12,presentation,development-validation,graph-diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: rustup show active-toolchain
      - name: Cache workspace test dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.targets }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test workspace integration targets
        if: matrix.targets == 'integration'
        run: cargo test --locked --release --workspace --no-default-features --features $env:FEATURES --test '*'
      - name: Test workspace unit targets
        if: matrix.targets == 'unit'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $options = @('--locked', '--no-default-features', '--features', $env:FEATURES)
          $metadata = cargo metadata --format-version 1 @options | ConvertFrom-Json
          $targets = @('--lib', '--bins')
          # Cargo --tests also includes examples and benches explicitly opted in to testing.
          foreach ($package in $metadata.packages) {
            if ($package.id -notin $metadata.workspace_members) { continue }
            $enabled = ($metadata.resolve.nodes | Where-Object id -eq $package.id).features
            foreach ($target in $package.targets) {
              if (!$target.test -or $target.kind[0] -notin @('example', 'bench')) { continue }
              if ($target.'required-features' | Where-Object { $_ -notin $enabled }) { continue }
              $targets += @("--$($target.kind[0])", $target.name)
            }
          }
          cargo test --workspace --release @options @targets

  windows-backend-tests:
    # Let the long workspace and browser suites acquire runners first.
    # A formatting failure still leaves all backend checks available.
    needs: [changes, format]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' }}
    name: windows-2022 / ${{ matrix.backend }} / ${{ matrix.suite }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: "vulkan,d3d12,presentation", suite: diagnostics }
          - { backend: vulkan, suite: release }
          - { backend: d3d12, suite: release }
          - { backend: "vulkan,d3d12", suite: release }
          - backend: vulkan
            suite: tracy
            configs: vulkan,tracy vulkan,tracy,development-validation,graph-diagnostics
          - backend: vulkan,d3d12
            suite: tracy-shipping
            configs: vulkan,d3d12,tracy
          - backend: vulkan,d3d12
            suite: tracy-development
            configs: vulkan,d3d12,tracy,development-validation,graph-diagnostics
    env:
      BACKEND: ${{ matrix.backend }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - *cargo-cache
      - name: Test optimized backend execution with development validation
        if: matrix.suite == 'release'
        shell: pwsh
        env:
          TEST_MODES: development
        run: *native-release-tests
      - name: Check independent diagnostic features
        if: matrix.suite == 'diagnostics'
        shell: pwsh
        run: *diagnostic-checks
      - name: Test Tracy configuration
        if: matrix.configs
        env:
          TRACY_CONFIGS: ${{ matrix.configs }}
        shell: pwsh
        run: *tracy-tests
