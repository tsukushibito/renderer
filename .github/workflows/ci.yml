name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check dependency advisories, licenses, versions, and sources
        # cargo-deny-action v2.1.1, containing cargo-deny 0.20.2.
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"
          arguments: --locked

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  check:
    name: ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native C compiler for development dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc
      - name: Install VMA C++ compiler (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'vulkan'
        run: sudo apt-get install -y --no-install-recommends g++
      - name: Check, lint, and test
        shell: pwsh
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          $featureArgs = @('--no-default-features')
          if ($env:BACKEND -eq 'vulkan') { $featureArgs += @('--features', 'vulkan') }
          cargo check --locked --workspace --all-targets @featureArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets @featureArgs -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace @featureArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
