[package]
name = "sashiko-worker-budget"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]
test = false
doctest = false

[[bin]]
name = "compare-worker-budget"
path = "src/main.rs"
test = false

[features]
web-threads = ["sashiko-jobs/web-threads"]

[dependencies]
rapier3d = { version = "0.36.1", features = ["parallel"] }
rayon = "1"
sashiko-animation = { path = "../../crates/sashiko-animation", version = "0.1.0" }
sashiko-heap.workspace = true
sashiko-jobs = { path = "../../crates/sashiko-jobs", version = "0.1.0" }
survivor = { path = "../../examples/survivor", version = "0.1.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
