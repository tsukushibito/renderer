[package]
name = "sashiko-asset-cook"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Offline cook and publication of static equipment assets"

[dependencies]
bevy_mikktspace = "1.0.0"
sashiko-asset = { version = "0.1.0", path = "../../crates/sashiko-asset" }
sashiko-renderer = { version = "0.1.0", path = "../../crates/sashiko-renderer", default-features = false }
getrandom = "0.4.3"
glam = "0.30"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "extras", "extensions"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[lints]
workspace = true
