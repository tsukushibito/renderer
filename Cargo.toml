[workspace]
members = [
    "crates/renderer-asset",
    "crates/renderer-core",
    "crates/renderer-bake",
    "crates/renderer-bistro",
    "crates/renderer-example-support",
    "crates/renderer",
    "crates/training-yard",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
ash = { version = "0.38", default-features = false, features = ["std", "loaded", "debug"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
vk-mem = "0.5"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
tracy-client = { version = "=0.19.0", default-features = false, features = ["enable", "ondemand", "only-localhost"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"

# Retain release optimization, checks, codegen and panic behavior. Full debug
# information supplies optimized Rust source/inline records for Windows PDBs.
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
