[workspace]
members = [
    "crates/sashiko",
    "crates/sashiko-math",
    "crates/sashiko-physics",
    "crates/sashiko-inspect",
    "examples/inspector-door",
    "crates/sashiko-animation",
    "crates/sashiko-animation-character",
    "crates/sashiko-jobs",
    "crates/sashiko-heap",
    "examples/jobs-web",
    "crates/sashiko-asset",
    "crates/sashiko-renderer-core",
    "crates/sashiko-lighting-bake",
    "tools/sashiko-asset-cook",
    "tools/worker-budget",
    "examples/renderer-scenes",
    "examples/support",
    "crates/sashiko-renderer",
    "examples/training-yard",
    "examples/survivor",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
sashiko-heap = { path = "crates/sashiko-heap", version = "0.1.0" }
ash = { version = "0.38", default-features = false, features = ["std", "loaded", "debug"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
vk-mem = "0.5"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
tracy-client = { version = "=0.19.0", default-features = false, features = ["enable", "ondemand", "only-localhost"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"

# Retain release optimization, checks, codegen and panic behavior. Full debug
# information supplies optimized Rust source/inline records for Windows PDBs.
[profile.profiling]
inherits = "release"
debug = 2
strip = "none"

# Parry 0.31 requires rstar 0.13, which pins heapless 0.8 (RUSTSEC-2026-0575..0582).
# Remove the adapter when Parry can select rstar 0.14 directly.
[patch.crates-io]
rstar = { path = "crates/sashiko-physics/compat/rstar" }
