[package]
name = "inspector-door"
description = "Headless live inspector acceptance game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
live-inspector = ["sashiko/live-inspector", "dep:serde"]
memory-profiling = ["sashiko-renderer-core/memory-profiling", "dep:sashiko-renderer-core"]

[dependencies]
sashiko = { version = "0.1.0", path = "../../crates/sashiko", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
sashiko-renderer-core = { version = "0.1.0", path = "../../crates/sashiko-renderer-core", optional = true, default-features = false }

[lints]
workspace = true
