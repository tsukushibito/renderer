[package]
name = "inspector-door"
description = "Headless live inspector acceptance game"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
live-inspector = ["sashiko/live-inspector", "dep:serde"]
memory-profiling = ["dep:sashiko-heap"]

[dependencies]
sashiko = { version = "0.1.0", path = "../../crates/sashiko" }
serde = { version = "1", features = ["derive"], optional = true }
sashiko-heap = { workspace = true, optional = true }

[lints]
workspace = true
