[package]
name = "renderer-scenes"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "renderer-scenes"
description = "Reference scene applications for Bistro, Sponza and Landscape"

[features]
landscape = ["vulkan", "dep:gltf", "dep:png"]
scene-viewer = ["vulkan", "presentation", "sashiko-asset/vulkan-presentation", "dep:png", "dep:exr"]
default = []
bake-tool = ["dep:sashiko-lighting-bake", "dep:serde", "dep:half"]
webgpu = ["sashiko-renderer/webgpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]
vulkan = ["dep:pollster", "sashiko-renderer/vulkan", "sashiko-lighting-bake?/vulkan"]
d3d12 = ["dep:pollster", "sashiko-renderer/d3d12", "sashiko-lighting-bake?/d3d12"]
development-validation = ["sashiko-renderer/development-validation", "sashiko-lighting-bake?/development-validation"]
vulkan-diagnostics = ["sashiko-renderer/vulkan-diagnostics"]
d3d12-diagnostics = ["sashiko-renderer/d3d12-diagnostics"]
graph-diagnostics = ["sashiko-renderer/graph-diagnostics"]
memory-profiling = ["sashiko-renderer/memory-profiling"]
presentation = ["sashiko-renderer/presentation", "dep:winit"]
tracy = ["sashiko-renderer/tracy", "dep:tracy-client"]

[[bin]]
name = "scene-viewer"
path = "src/bin/scene-viewer.rs"
required-features = ["scene-viewer"]

[[bin]]
name = "landscape"
path = "src/bin/landscape.rs"
required-features = ["landscape"]

[[bin]]
name = "renderer-scenes-bake"
path = "src/bin/renderer-scenes-bake.rs"
required-features = ["bake-tool"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "0.4", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Response", "Url", "Location", "HtmlCanvasElement"] }

[dependencies]
sashiko-asset = { version = "0.1.0", path = "../../crates/sashiko-asset", optional = true }
gltf = { version = "1.4.1", default-features = false, features = ["utils"], optional = true }
png = { version = "0.18", optional = true }
exr = { version = "1.7", optional = true, default-features = false }
half = { version = "2.7.1", optional = true }
sashiko-lighting-bake = { version = "0.1.0", path = "../../crates/sashiko-lighting-bake", optional = true }
sashiko-renderer-core = { version = "0.1.0", path = "../../crates/sashiko-renderer-core", default-features = false }
sashiko-renderer = { version = "0.1.0", path = "../../crates/sashiko-renderer", default-features = false }
sashiko-example-support = { version = "0.1.0", path = "../support" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1.0"
sha2 = "0.10.9"
tracy-client = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }

[lints]
workspace = true
