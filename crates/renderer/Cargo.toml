[package]
name = "renderer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "RenderGraph-centered renderer for game engine integration"

[features]
default = []
vulkan = ["dep:ash", "dep:vk-mem", "dep:tracing"]

[dependencies]
ash = { workspace = true, optional = true }
vk-mem = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "transfer_planning"
harness = false

[lints]
workspace = true
