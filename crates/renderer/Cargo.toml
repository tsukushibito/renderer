[package]
name = "renderer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "RenderGraph-centered renderer for game engine integration"

[features]
default = []
vulkan = ["dep:ash", "dep:vk-mem", "dep:tracing"]
presentation = ["vulkan", "dep:ash-window", "dep:raw-window-handle", "dep:winit"]
d3d12 = ["dep:windows-core"]

[dependencies]
ash = { workspace = true, optional = true }
vk-mem = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.100.0", optional = true, default-features = false, features = ["std"] }
ash-window = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }

[dev-dependencies]
criterion.workspace = true
tracing-subscriber.workspace = true
serde_json = "1.0"

[[bench]]
name = "transfer_planning"
harness = false

[[example]]
name = "headless"
required-features = ["vulkan"]

[[example]]
name = "frame_loop"
required-features = ["vulkan"]

[[example]]
name = "windowed"
required-features = ["presentation"]

[lints]
workspace = true

[[example]]
name = "engine_workloads"
required-features = ["vulkan"]
