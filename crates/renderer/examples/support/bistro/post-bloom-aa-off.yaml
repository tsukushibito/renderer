# Use with --aa-off and --bloom tent or --bloom box.
version: 1
resources:
  - { id: hdr, kind: image, source: external, extent: frame, format: rgba16_float }
  - { id: bloom_extract, kind: image, extent: frame, format: rgba16_float }
  - { id: bloom_half, kind: image, extent: frame, divisor: 2, format: rgba16_float }
  - { id: bloom_quarter, kind: image, extent: frame, divisor: 4, format: rgba16_float }
  - { id: bloom_blurred, kind: image, extent: frame, divisor: 4, format: rgba16_float }
  - { id: bloom_hdr, kind: image, extent: frame, format: rgba16_float }
  - { id: neutral, kind: image, extent: frame, format: rgba16_float }
  - { id: sdr, kind: image, extent: frame, format: rgba8_unorm }
passes:
  - id: extract
    kind: compute
    shader: bloom/extract
    bindings:
      - { kind: image, group: 0, binding: 0, resource: hdr }
      - { kind: image, group: 1, binding: 0, resource: bloom_extract }
  - id: downsample_half
    kind: compute
    shader: bloom/downsample
    bindings:
      - { kind: image, group: 0, binding: 0, resource: bloom_extract }
      - { kind: image, group: 1, binding: 0, resource: bloom_half }
  - id: downsample_quarter
    kind: compute
    shader: bloom/downsample
    bindings:
      - { kind: image, group: 0, binding: 0, resource: bloom_half }
      - { kind: image, group: 1, binding: 0, resource: bloom_quarter }
  - id: blur
    kind: compute
    shader: bloom/blur
    bindings:
      - { kind: image, group: 0, binding: 0, resource: bloom_quarter }
      - { kind: image, group: 1, binding: 0, resource: bloom_blurred }
  - id: combine
    kind: compute
    shader: bloom/combine
    bindings:
      - { kind: image, group: 0, binding: 0, resource: hdr }
      - { kind: image, group: 0, binding: 1, resource: bloom_blurred }
      - { kind: image, group: 1, binding: 0, resource: bloom_hdr }
  - id: tone_map
    kind: raster
    shader: post/neutral
    constants: [1073741824] # f32 bits of the linear exposure multiplier 2.0
    bindings:
      - { kind: image, group: 0, binding: 0, resource: bloom_hdr }
      - { kind: sampler, group: 0, binding: 1, sampler: nearest_clamp }
    colors:
      - { image: neutral, load: clear, clear: [0, 0, 0, 0] }
  - id: write_sdr
    kind: raster
    shader: post/sdr
    bindings:
      - { kind: image, group: 0, binding: 0, resource: neutral }
      - { kind: sampler, group: 0, binding: 1, sampler: nearest_clamp }
    colors:
      - { image: sdr, load: clear, clear: [0, 0, 0, 0] }
output: sdr
