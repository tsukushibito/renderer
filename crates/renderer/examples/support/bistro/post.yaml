# Use with Bloom disabled. Bistro supplies scene-linear HDR and the recipe owns the SDR output.
version: 1
resources:
  - { id: hdr, kind: image, source: external, extent: frame, format: rgba16_float }
  - { id: neutral, kind: image, extent: frame, format: rgba16_float }
  - { id: sdr, kind: image, extent: frame, format: rgba8_unorm }
passes:
  - id: tone_map
    kind: raster
    shader: post/neutral
    constants: [1073741824] # f32 bits of the linear exposure multiplier 2.0
    bindings:
      - { kind: image, group: 0, binding: 0, resource: hdr }
      - { kind: sampler, group: 0, binding: 1, sampler: nearest_clamp }
    colors:
      - { image: neutral, load: clear, clear: [0, 0, 0, 0] }
  - id: write_sdr
    kind: raster
    shader: post/sdr
    bindings:
      - { kind: image, group: 0, binding: 0, resource: neutral }
      - { kind: sampler, group: 0, binding: 1, sampler: linear_clamp }
    colors:
      - { image: sdr, load: clear, clear: [0, 0, 0, 0] }
output: sdr
