[package]
name = "sashiko-jobs"
description = "Scoped CPU jobs for Sashiko hosts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
scheduler-metrics = []
tracy = ["dep:tracy-client"]
web-threads = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
tracy-client = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["DedicatedWorkerGlobalScope"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sashiko-heap.workspace = true
