[package]
name = "sashiko-jobs"
description = "Scoped CPU jobs for Sashiko hosts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
web-threads = ["dep:rayon", "dep:wasm-bindgen-rayon", "dep:wasm-bindgen-futures", "dep:web-sys"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1.12", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["DedicatedWorkerGlobalScope"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sashiko-renderer-core = { version = "0.1.0", path = "../sashiko-renderer-core", features = ["memory-profiling"] }
