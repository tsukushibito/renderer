[package]
name = "survivor"
default-run = "survivor"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[features]
embed = []
default = ["vulkan", "presentation"]
vulkan = ["sashiko/vulkan", "renderer/vulkan"]
d3d12 = ["sashiko/d3d12", "renderer/d3d12"]
presentation = ["renderer/presentation", "sashiko/presentation", "sashiko/audio-output"]
development-validation = ["renderer?/development-validation"]
memory-profiling = ["renderer?/memory-profiling"]

[dependencies]
sashiko = { version = "0.1.0", path = "../sashiko", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }

[target.'cfg(windows)'.dependencies]
renderer = { version = "0.1.0", path = "../renderer", optional = true }

[lints]
workspace = true
