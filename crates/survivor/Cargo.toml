[package]
name = "survivor"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[features]
default = ["vulkan", "presentation"]
vulkan = ["renderer/vulkan"]
d3d12 = ["renderer/d3d12"]
presentation = ["renderer/presentation", "dep:winit"]
development-validation = ["renderer?/development-validation"]
memory-profiling = ["renderer?/memory-profiling"]

[dependencies]
sashiko = { path = "../sashiko" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }

[target.'cfg(windows)'.dependencies]
renderer = { version = "0.1.0", path = "../renderer", optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[lints]
workspace = true
