[package]
name = "training-yard"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[features]
default = ["graphics"]
graphics = ["dep:renderer"]
presentation = ["graphics", "renderer/presentation"]
vulkan = ["renderer-core/vulkan", "renderer?/vulkan"]
d3d12 = ["renderer-core/d3d12", "renderer?/d3d12"]
development-validation = ["renderer-core/development-validation", "renderer?/development-validation"]

[dependencies]
renderer = { version = "0.1.0", path = "../renderer", optional = true }
renderer-core = { version = "0.1.0", path = "../renderer-core" }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[[test]]
name = "host_output"
required-features = ["graphics"]

[lints]
workspace = true
