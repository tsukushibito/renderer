[package]
name = "sashiko-renderer-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "RenderGraph-centered renderer for game engine integration"

[features]
default = []
scheduler-metrics = ["sashiko-jobs/scheduler-metrics"]
# Optional Renderer diagnostics, independent of optimization and native layers.
development-validation = ["vulkan-diagnostics", "d3d12-diagnostics"]
# Native callback monitoring and debug names/labels can be enabled independently.
vulkan-diagnostics = []
d3d12-diagnostics = []
# Detailed Graph dumps are independent of validation and profiling.
graph-diagnostics = []
# Allocation/native event counters; independent of validation and optimization.
memory-profiling = ["dep:sashiko-heap"]
# Optional explicit CPU zones; independent of native layers and GPU timestamps.
tracy = ["dep:tracy-client", "sashiko-jobs/tracy"]
vulkan = ["dep:ash", "dep:vk-mem", "dep:tracing"]
presentation = ["dep:raw-window-handle", "dep:windows-sys"]
d3d12 = ["dep:windows-core"]
webgpu = ["dep:wgpu", "dep:web-sys"]

[dependencies]
sashiko-heap = { workspace = true, optional = true }
sashiko-jobs = { version = "0.1.0", path = "../sashiko-jobs" }
ash = { workspace = true, optional = true }
vk-mem = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["webgpu", "wgsl"], optional = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.100.0", optional = true, default-features = false, features = ["std"] }
raw-window-handle = { version = "0.6", optional = true, features = ["std"] }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"

[dev-dependencies]
sashiko-heap.workspace = true
criterion.workspace = true
tracing-subscriber.workspace = true
sashiko-renderer = { version = "0.1.0", path = "../sashiko-renderer" }
sashiko-example-support = { version = "0.1.0", path = "../../examples/support" }
serde_json = "1.0"
sha2 = "0.10.9"

[[bench]]
name = "transfer_planning"
harness = false

[[bench]]
name = "d3d12_reuse"
harness = false

[[bench]]
name = "vulkan_resource_cache"
harness = false

[[example]]
name = "headless"
required-features = ["vulkan"]

[[example]]
name = "frame_loop"
required-features = ["vulkan"]

[[example]]
name = "windowed"
required-features = ["presentation"]

[lints]
workspace = true

[[example]]
name = "engine_workloads"
required-features = ["vulkan"]

[[example]]
name = "frame_memory"
required-features = ["memory-profiling"]

[[example]]
name = "profile_workload"
test = true
