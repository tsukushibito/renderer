[package]
name = "sashiko"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
cli = ["dep:clap"]
audio-output = ["dep:cpal"]
presentation = ["dep:winit", "renderer/presentation", "dep:windows-sys"]
vulkan = ["renderer/vulkan"]
d3d12 = ["renderer/d3d12"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
cpal = { version = "0.16", optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"], optional = true }
renderer = { version = "0.1.0", path = "../renderer", default-features = false }
hound = "3.5"
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
renderer-asset = { version = "0.1.0", path = "../renderer-asset" }

[lints]
workspace = true
