[package]
description = "Game creation API for the Sashiko engine"
name = "sashiko"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
memory-profiling = ["sashiko-renderer/memory-profiling"]
cli = ["dep:clap"]
audio-output = ["dep:cpal"]
presentation = ["dep:winit", "dep:raw-window-handle", "sashiko-renderer/presentation", "dep:windows-sys"]
vulkan = ["sashiko-renderer/vulkan"]
d3d12 = ["sashiko-renderer/d3d12"]
webgpu = ["sashiko-renderer/webgpu"]

[target.'cfg(windows)'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
windows-sys = { version = "0.61", optional = true, features = ["Win32_UI_Input_XboxController", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
cpal = { version = "0.16", optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[dependencies]
sashiko-animation = { version = "0.1.0", path = "../sashiko-animation" }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"], optional = true }
sashiko-renderer = { version = "0.1.0", path = "../sashiko-renderer", default-features = false }
hound = "3.5"
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sashiko-asset = { version = "0.1.0", path = "../sashiko-asset" }

[lints]
workspace = true
