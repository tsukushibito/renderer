[package]
name = "sashiko"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
renderer-asset = { path = "../renderer-asset" }

[lints]
workspace = true

[features]
audio-output = ["dep:cpal"]

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.16", optional = true }
