[package]
name = "sashiko"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
presentation = ["dep:winit"]

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }

[dependencies]
renderer = { path = "../renderer", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
renderer-asset = { path = "../renderer-asset" }

[lints]
workspace = true
