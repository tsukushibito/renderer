[package]
name = "sashiko-animation"
version = "0.1.0"
description = "Headless fixed-tick character animation evaluation"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
experimental-rayon = ["sashiko-jobs/experimental-rayon"]
scheduler-metrics = ["sashiko-jobs/scheduler-metrics"]

[dependencies]
sashiko-jobs = { path = "../sashiko-jobs", version = "0.1.0" }
glam = "0.30"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sashiko-heap.workspace = true
