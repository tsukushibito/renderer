[package]
name = "renderer-pipeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Declarative RenderGraph composition for renderer"

[features]
default = []
vulkan = ["renderer/vulkan"]
d3d12 = ["renderer/d3d12"]
development-validation = ["renderer/development-validation"]
memory-profiling = ["renderer/memory-profiling"]

[dependencies]
renderer = { version = "0.1.0", path = "../renderer", default-features = false }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }

[lints]
workspace = true

[[example]]
name = "yaml_pipeline"
required-features = ["vulkan", "d3d12"]
