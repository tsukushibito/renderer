version: 1
resources:
  - { id: final, kind: image, source: external, width: 9, height: 7, format: rgba8_unorm }
  - { id: vertex_offset, kind: buffer, source: external, bytes: 16 }

draw_lists:
  - { id: layered, view: main, queue: layered }

passes:
  - id: final_image
    kind: raster
    shader_template: scene/layers
    material_types: [replace, additive]
    draw_list: layered
    colors:
      - { image: final, load: clear, clear: [0.0, 0.0, 0.0, 1.0] }
    bindings:
      - { kind: buffer, group: 0, binding: 0, resource: vertex_offset, offset: 0, size: 16 }
      - { kind: material, group: 1, binding: 0, resource: color }
      - { kind: sampler, group: 1, binding: 1, sampler: nearest_clamp }

output: final
