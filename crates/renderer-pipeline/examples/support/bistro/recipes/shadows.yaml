# Each cascade is rendered by its own pass or supplied by the frame cache.
version: 1
resources:
  - { id: camera, kind: buffer, source: external, bytes: 464 }
  - id: cascade_0
    kind: image
    source: { render: shadow_0, reuse: frame_input }
    width: 2048
    height: 2048
    format: depth32_float
  - id: cascade_1
    kind: image
    source: { render: shadow_1, reuse: frame_input }
    width: 2048
    height: 2048
    format: depth32_float
  - id: cascade_2
    kind: image
    source: { render: shadow_2, reuse: frame_input }
    width: 2048
    height: 2048
    format: depth32_float
  - id: cascade_3
    kind: image
    source: { render: shadow_3, reuse: frame_input }
    width: 2048
    height: 2048
    format: depth32_float
draw_lists:
  - { id: shadow_0, view: sun_0, queue: shadow }
  - { id: shadow_1, view: sun_1, queue: shadow }
  - { id: shadow_2, view: sun_2, queue: shadow }
  - { id: shadow_3, view: sun_3, queue: shadow }
passes:
  - id: shadow_0
    kind: raster
    shader_template: bistro/shadow
    material_types: [bistro/pbr]
    draw_list: shadow_0
    depth: { image: cascade_0, load: clear, clear: 1.0 }
    bindings:
      - { kind: buffer, group: 0, binding: 0, resource: camera, offset: 0, size: 464 }
      - { kind: material, group: 0, binding: 1, resource: factors }
      - { kind: material, group: 1, binding: 0, resource: base_color }
      - { kind: sampler, group: 1, binding: 4, sampler: linear_repeat }
  - id: shadow_1
    kind: raster
    shader_template: bistro/shadow
    material_types: [bistro/pbr]
    draw_list: shadow_1
    depth: { image: cascade_1, load: clear, clear: 1.0 }
    bindings:
      - { kind: buffer, group: 0, binding: 0, resource: camera, offset: 0, size: 464 }
      - { kind: material, group: 0, binding: 1, resource: factors }
      - { kind: material, group: 1, binding: 0, resource: base_color }
      - { kind: sampler, group: 1, binding: 4, sampler: linear_repeat }
  - id: shadow_2
    kind: raster
    shader_template: bistro/shadow
    material_types: [bistro/pbr]
    draw_list: shadow_2
    depth: { image: cascade_2, load: clear, clear: 1.0 }
    bindings:
      - { kind: buffer, group: 0, binding: 0, resource: camera, offset: 0, size: 464 }
      - { kind: material, group: 0, binding: 1, resource: factors }
      - { kind: material, group: 1, binding: 0, resource: base_color }
      - { kind: sampler, group: 1, binding: 4, sampler: linear_repeat }
  - id: shadow_3
    kind: raster
    shader_template: bistro/shadow
    material_types: [bistro/pbr]
    draw_list: shadow_3
    depth: { image: cascade_3, load: clear, clear: 1.0 }
    bindings:
      - { kind: buffer, group: 0, binding: 0, resource: camera, offset: 0, size: 464 }
      - { kind: material, group: 0, binding: 1, resource: factors }
      - { kind: material, group: 1, binding: 0, resource: base_color }
      - { kind: sampler, group: 1, binding: 4, sampler: linear_repeat }
