# Forward+ culls lights into the initialized reusable tile buffer.
version: 1
resources:
  - { id: lights, kind: buffer, source: external, bytes: 2064 }
  - { id: tiles, kind: buffer, source: external, bytes: 17039360 }
passes:
  - id: cull_local_lights
    kind: compute
    shader: bistro/cull-local-lights
    grid: { param: tile_grid }
    bindings:
      - { kind: buffer, group: 0, binding: 0, resource: camera, offset: 0, size: 64 }
      - { kind: buffer, group: 0, binding: 2, resource: lights, offset: 0, size: 2064 }
      - { kind: buffer, group: 0, binding: 3, resource: tiles, offset: 0, size: { param: tile_write_bytes } }
