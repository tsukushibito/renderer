# GPU frustum culling followed by indirect command encoding per material group.
version: 1
resources:
  - { id: packed_bounds, kind: buffer, source: external, bytes: { param: bounds_bytes } }
  - { id: visibility, kind: buffer, bytes: { param: visibility_bytes } }
passes:
  - id: cull_packed_draws
    kind: compute
    shader: bistro/frustum-visibility
    grid: { param: visibility_grid }
    bindings:
      - { kind: buffer, group: 0, binding: 0, resource: camera, offset: 0, size: 64 }
      - { kind: buffer, group: 0, binding: 1, resource: packed_bounds, offset: 0, size: { param: bounds_bytes } }
      - { kind: buffer, group: 0, binding: 2, resource: visibility, offset: 0, size: { param: visibility_bytes } }
  - id: encode_packed_draws
    kind: encode_indexed_indirect
    visibility: visibility
    table_list: packed_opaque
