# Tone map the scene HDR directly.
version: 1
resources:
  - { id: neutral, kind: image, extent: frame, format: rgba16_float }
passes:
  - id: tone_map
    kind: raster
    shader: post/neutral
    constants: [1073741824] # f32 bits of the linear exposure multiplier 2.0
    bindings:
      - { kind: image, group: 0, binding: 0, resource: hdr }
      - { kind: sampler, group: 0, binding: 1, sampler: nearest_clamp }
    colors:
      - { image: neutral, load: clear, clear: [0, 0, 0, 0] }
