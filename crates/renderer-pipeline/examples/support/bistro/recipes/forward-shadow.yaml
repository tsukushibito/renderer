# Startup shader selection for the offline material bundle.
# Bistro frame recipes use the selected Forward and shadow Programs.
version: 1
resources:
  - { id: hdr, kind: image, width: 1, height: 1, format: rgba16_float }
  - { id: depth, kind: image, width: 1, height: 1, format: depth32_float }
  - { id: shadow_depth, kind: image, width: 1, height: 1, format: depth32_float }
draw_lists:
  - { id: shadow_casters, view: sun, queue: shadow }
  - { id: forward_opaque, view: main, queue: opaque }
  - { id: forward_transparent, view: main, queue: transparent }
passes:
  - id: shadow
    kind: raster
    shader_template: bistro/shadow
    material_types: [bistro/pbr]
    draw_list: shadow_casters
    depth: { image: shadow_depth, load: clear, clear: 1.0 }
    bindings:
      - { kind: material, group: 0, binding: 0, resource: camera }
      - { kind: material, group: 0, binding: 1, resource: factors }
      - { kind: material, group: 1, binding: 0, resource: base_color }
      - { kind: material, group: 1, binding: 4, resource: material_sampler }
  - id: forward
    kind: raster
    shader_template: bistro/forward
    material_types: [bistro/pbr]
    draw_list: forward_opaque
    colors:
      - { image: hdr, load: clear, clear: [0.0, 0.0, 0.0, 1.0] }
    depth: { image: depth, load: clear, clear: 1.0 }
    bindings:
      - { kind: material, group: 0, binding: 0, resource: camera }
      - { kind: material, group: 0, binding: 1, resource: factors }
      - { kind: material, group: 1, binding: 0, resource: base_color }
      - { kind: material, group: 1, binding: 1, resource: normal }
      - { kind: material, group: 1, binding: 2, resource: orm }
      - { kind: material, group: 1, binding: 3, resource: emissive }
      - { kind: material, group: 1, binding: 4, resource: material_sampler }
      - { kind: material, group: 2, binding: 0, resource: irradiance }
      - { kind: material, group: 2, binding: 1, resource: reflection }
      - { kind: material, group: 2, binding: 2, resource: brdf }
      - { kind: material, group: 2, binding: 3, resource: ibl_sampler }
      - { kind: material, group: 3, binding: 0, resource: cascade_0 }
      - { kind: material, group: 3, binding: 1, resource: cascade_1 }
      - { kind: material, group: 3, binding: 2, resource: cascade_2 }
      - { kind: material, group: 3, binding: 3, resource: cascade_3 }
      - { kind: material, group: 3, binding: 4, resource: shadow_sampler }
  - id: forward_blend
    kind: raster
    shader: bistro/forward-blend
    draw_list: forward_transparent
    colors:
      - { image: hdr, load: load }
    depth: { image: depth, load: load }
    bindings:
      - { kind: material, group: 0, binding: 0, resource: camera }
      - { kind: material, group: 0, binding: 1, resource: factors }
      - { kind: material, group: 1, binding: 0, resource: base_color }
      - { kind: material, group: 1, binding: 1, resource: normal }
      - { kind: material, group: 1, binding: 2, resource: orm }
      - { kind: material, group: 1, binding: 3, resource: emissive }
      - { kind: material, group: 1, binding: 4, resource: material_sampler }
      - { kind: material, group: 2, binding: 0, resource: irradiance }
      - { kind: material, group: 2, binding: 1, resource: reflection }
      - { kind: material, group: 2, binding: 2, resource: brdf }
      - { kind: material, group: 2, binding: 3, resource: ibl_sampler }
      - { kind: material, group: 3, binding: 0, resource: cascade_0 }
      - { kind: material, group: 3, binding: 1, resource: cascade_1 }
      - { kind: material, group: 3, binding: 2, resource: cascade_2 }
      - { kind: material, group: 3, binding: 3, resource: cascade_3 }
      - { kind: material, group: 3, binding: 4, resource: shadow_sampler }
output: hdr
