[package]
name = "renderer-bistro"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "bistro"
description = "Bistro reference scene applications for Renderer"

[features]
default = []
bake-tool = ["dep:renderer-bake", "dep:serde"]
vulkan = ["renderer/vulkan", "renderer-bake?/vulkan"]
d3d12 = ["renderer/d3d12", "renderer-bake?/d3d12"]
development-validation = ["renderer/development-validation", "renderer-bake?/development-validation"]
vulkan-diagnostics = ["renderer/vulkan-diagnostics"]
d3d12-diagnostics = ["renderer/d3d12-diagnostics"]
graph-diagnostics = ["renderer/graph-diagnostics"]
memory-profiling = ["renderer/memory-profiling"]
presentation = ["renderer/presentation", "dep:winit"]
tracy = ["renderer/tracy", "dep:tracy-client"]

[[bin]]
name = "bistro-bake"
path = "src/bin/bistro-bake.rs"
required-features = ["bake-tool"]

[dependencies]
renderer-bake = { version = "0.1.0", path = "../renderer-bake", optional = true }
renderer-core = { version = "0.1.0", path = "../renderer-core", default-features = false }
renderer = { version = "0.1.0", path = "../renderer", default-features = false }
renderer-example-support = { version = "0.1.0", path = "../renderer-example-support" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1.0"
sha2 = "0.10.9"
tracy-client = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }

[lints]
workspace = true
