[package]
name = "renderer-bistro"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "bistro"
description = "Bistro reference scene applications for Renderer"

[features]
default = []
vulkan = ["renderer-pipeline/vulkan"]
d3d12 = ["renderer-pipeline/d3d12"]
development-validation = ["renderer-pipeline/development-validation"]
vulkan-diagnostics = ["renderer-pipeline/vulkan-diagnostics"]
d3d12-diagnostics = ["renderer-pipeline/d3d12-diagnostics"]
graph-diagnostics = ["renderer-pipeline/graph-diagnostics"]
memory-profiling = ["renderer-pipeline/memory-profiling"]
presentation = ["renderer-pipeline/presentation", "dep:winit"]
tracy = ["renderer-pipeline/tracy", "dep:tracy-client"]

[dependencies]
renderer = { version = "0.1.0", path = "../renderer", default-features = false }
renderer-pipeline = { version = "0.1.0", path = "../renderer-pipeline", default-features = false }
renderer-example-support = { version = "0.1.0", path = "../renderer-example-support" }
serde_json = "1.0"
sha2 = "0.10.9"
tracy-client = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06"] }

[lints]
workspace = true
