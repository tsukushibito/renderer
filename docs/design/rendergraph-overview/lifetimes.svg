<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 910" role="img" aria-labelledby="title desc">
  <title id="title">GPU処理の完了と各所有の終了を分ける</title>
  <desc id="desc">時間は上から下へ進む。準備済みGraph slotへ構築し、compileで同じ領域を不変planにする。submit受理後もnative資源を保持する。正常完了を観測すると実行枠等を回収できるが未読readbackは保持する。readback_into成功でCPU結果の領域を返し、必要な全consumerがplanのpinを返した後でGraph slotを再利用できる。export物理資源の登録解除は別の明示deleteである。</desc>
  <defs>
    <marker id="time-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#55748e"/></marker>
  </defs>
  <rect width="600" height="910" rx="16" fill="#f4f7fb"/>
  <g font-family="sans-serif" fill="#17324d">
    <text x="26" y="42" font-size="24" font-weight="700">処理の完了と、所有の終了</text>
    <text x="26" y="78" font-size="19">時間は上から下へ進む。返却条件は別々。</text>
    <path d="M54 127V827" fill="none" stroke="#55748e" stroke-width="3" marker-end="url(#time-arrow)"/>
    <rect x="89" y="110" width="483" height="98" rx="10" fill="#ffffff" stroke="#889db2"/>
    <circle cx="54" cy="145" r="10" fill="#55748e"/>
    <text x="108" y="147" font-size="22" font-weight="700">Graph構築</text>
    <text x="108" y="183" font-size="19">準備済みslotへ資源・命令を追加</text>
    <rect x="89" y="233" width="483" height="98" rx="10" fill="#e7f1ff" stroke="#356cb0"/>
    <circle cx="54" cy="268" r="10" fill="#356cb0"/>
    <text x="108" y="270" font-size="22" font-weight="700">compile</text>
    <text x="108" y="306" font-size="19">同じ領域を不変planとして保持</text>
    <rect x="89" y="356" width="483" height="98" rx="10" fill="#e7f1ff" stroke="#356cb0"/>
    <circle cx="54" cy="391" r="10" fill="#356cb0"/>
    <text x="108" y="393" font-size="22" font-weight="700">submit受理</text>
    <text x="108" y="429" font-size="19">native参照を保持／予定状態を更新</text>
    <rect x="89" y="479" width="483" height="98" rx="10" fill="#e8f4ed" stroke="#37734e"/>
    <circle cx="54" cy="514" r="10" fill="#37734e"/>
    <text x="108" y="516" font-size="22" font-weight="700">GPU正常完了を観測</text>
    <text x="108" y="552" font-size="19">実行枠等は回収可／未読結果は保持</text>
    <rect x="89" y="602" width="483" height="98" rx="10" fill="#e8f4ed" stroke="#37734e"/>
    <circle cx="54" cy="637" r="10" fill="#37734e"/>
    <text x="108" y="639" font-size="22" font-weight="700">readback_into</text>
    <text x="108" y="675" font-size="19">CPU消費が成功 → staging領域を返却</text>
    <rect x="89" y="725" width="483" height="98" rx="10" fill="#ffffff" stroke="#889db2" stroke-width="2"/>
    <circle cx="54" cy="760" r="10" fill="#55748e"/>
    <text x="108" y="762" font-size="22" font-weight="700">必要な全consumerがpinを返却</text>
    <text x="108" y="798" font-size="19">Graph slotを再取得・resetできる</text>
    <text x="26" y="862" font-size="18">export物理資源の登録解除は、別の明示delete。</text>
    <text x="26" y="889" font-size="18">poolは通常フレーム全体を通して保持する。</text>
  </g>
</svg>
