<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" role="img" aria-labelledby="title desc">
  <title id="title">producerとhazardを分けて不要パスを除去する例</title>
  <desc id="desc">宣言順はP0 old upload、P1 unused copy、P2 replacement、P3 readback。P0はP1の内容を作り、P2はP3の内容を作る。P0からP2にはWAW、P1からP2にはWARの順序制約もあるが、結果に必要な内容はP2からP3だけ。culling後はP2とP3を残し、その二つでRAWを作り直す。</desc>
  <defs>
    <marker id="producer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#3268a8"/></marker>
  </defs>
  <rect width="600" height="820" rx="16" fill="#f4f7fb"/>
  <g font-family="sans-serif" fill="#17324d">
    <text x="26" y="40" font-size="24" font-weight="700">必要な内容からpassを選ぶ</text>
    <text x="26" y="75" font-size="19">宣言順：P0 → P1 → P2 → P3</text>
    <rect x="18" y="98" width="564" height="300" rx="12" fill="#ffffff" stroke="#a5b5c6"/>
    <text x="34" y="132" font-size="21" font-weight="700">① 内容を作る辺 〈producer〉</text>
    <rect x="34" y="153" width="246" height="78" rx="9" fill="#eff1f4" stroke="#788896"/>
    <text x="49" y="184" font-size="21" font-weight="700">P0  old upload</text>
    <text x="49" y="214" font-size="18">dataに古い4 byte</text>
    <path d="M157 234V284" fill="none" stroke="#3268a8" stroke-width="3" marker-end="url(#producer)"/>
    <text x="171" y="265" font-size="17" fill="#295688">内容</text>
    <rect x="34" y="295" width="246" height="78" rx="9" fill="#eff1f4" stroke="#788896"/>
    <text x="49" y="326" font-size="21" font-weight="700">P1  unused copy</text>
    <text x="49" y="356" font-size="18">scratchへcopy、未使用</text>
    <rect x="320" y="153" width="246" height="78" rx="9" fill="#e7f1ff" stroke="#356cb0" stroke-width="2"/>
    <text x="335" y="184" font-size="21" font-weight="700">P2  replacement</text>
    <text x="335" y="214" font-size="18">dataに新しい4 byte</text>
    <path d="M443 234V284" fill="none" stroke="#3268a8" stroke-width="3" marker-end="url(#producer)"/>
    <text x="457" y="265" font-size="17" fill="#295688">内容</text>
    <rect x="320" y="295" width="246" height="78" rx="9" fill="#e7f1ff" stroke="#356cb0" stroke-width="2"/>
    <text x="335" y="326" font-size="21" font-weight="700">P3  readback</text>
    <text x="335" y="356" font-size="18">観測する結果</text>
    <rect x="18" y="420" width="564" height="155" rx="12" fill="#fff5e5" stroke="#ad772c"/>
    <text x="34" y="455" font-size="21" font-weight="700">② 順序制約 〈hazard〉 もある</text>
    <text x="34" y="493" font-size="20">P0 → P2：WAW　 P1 → P2：WAR</text>
    <text x="34" y="531" font-size="19">この辺だけでP0・P1を残すことはしない。</text>
    <text x="34" y="559" font-size="17">残ったpassだけで、必要な順序を再計算する。</text>
    <rect x="18" y="598" width="564" height="197" rx="12" fill="#e8f4ed" stroke="#37734e" stroke-width="2"/>
    <text x="34" y="635" font-size="21" font-weight="700">③ culling後の実行計画</text>
    <rect x="34" y="658" width="230" height="61" rx="9" fill="#ffffff" stroke="#37734e"/>
    <text x="49" y="696" font-size="21" font-weight="700">P2  replacement</text>
    <path d="M269 688H328" fill="none" stroke="#3268a8" stroke-width="3" marker-end="url(#producer)"/>
    <text x="279" y="674" font-size="16">RAW</text>
    <rect x="339" y="658" width="227" height="61" rx="9" fill="#ffffff" stroke="#37734e"/>
    <text x="356" y="696" font-size="21" font-weight="700">P3  readback</text>
    <text x="34" y="753" font-size="19">P0・P1を除去し、必要な新しい内容だけを残す。</text>
    <text x="34" y="779" font-size="17">全てのreadの初期化検査は、除去より先に行う。</text>
  </g>
</svg>
